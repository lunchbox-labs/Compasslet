name: Release
on:
  # Run by hand from main once Apple approves the version the project names. It releases that
  # version on the App Store, then tags the commit its build came from and publishes the GitHub
  # Release. It never uploads or submits a build; Publish does that.
  workflow_dispatch:
    inputs:
      app-store-release:
        description: Release the approved version on the App Store (off for a version that's already live)
        type: boolean
        default: true
      screenshots:
        description: Capture every screen at the released commit and attach the images to the GitHub Release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      # Reads the Publish run that uploaded the approved build.
      actions: read
    outputs:
      version: ${{ steps.build.outputs.version }}
      build_number: ${{ steps.build.outputs.build_number }}
      tag: ${{ steps.build.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Find the approved build of the project's version
        id: build
        env:
          RELEASE_APP_STORE: ${{ inputs.app-store-release }}
          ASC_METADATA_API_KEY_ID: ${{ vars.ASC_METADATA_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
          ASC_METADATA_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_METADATA_API_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/app_store.py approved
      - name: Find the commit the build came from and check its tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          RELEASE_BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: python3 scripts/github_release.py source
  screenshots:
    needs: prepare
    if: inputs.screenshots
    uses: ./.github/workflows/screenshots.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      max-parts: "1"
  # After the capture, so a failed capture never leaves a live version without its GitHub Release.
  app-store:
    needs: [prepare, screenshots]
    if: >-
      !cancelled() && inputs.app-store-release && needs.prepare.result == 'success' &&
      (needs.screenshots.result == 'success' ||
       (!inputs.screenshots && needs.screenshots.result == 'skipped')) &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Release the approved version on the App Store
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          ASC_METADATA_API_KEY_ID: ${{ vars.ASC_METADATA_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
          ASC_METADATA_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_METADATA_API_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/app_store.py release
  github-release:
    needs: [prepare, screenshots, app-store]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.screenshots.result == 'success' ||
       (!inputs.screenshots && needs.screenshots.result == 'skipped')) &&
      (needs.app-store.result == 'success' ||
       (!inputs.app-store-release && needs.app-store.result == 'skipped')) &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write to the repository: it creates the tag and the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.screenshots
        with:
          name: ${{ needs.screenshots.outputs.artifact }}
          path: ${{ runner.temp }}/screenshots
      - name: Tag the build's commit and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_ASSETS: ${{ inputs.screenshots && format('{0}/screenshots', runner.temp) || '' }}
        run: python3 scripts/github_release.py publish
