name: Publish
on:
  # Run by hand from main. Once Apple approves the submitted version, the Release workflow
  # releases it and makes its tag and GitHub Release; neither tags nor releases start an upload.
  workflow_dispatch:
    inputs:
      submit:
        description: Upload the listing screenshots and submit the version for App Review (off for a TestFlight-only build)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: publish-internal-testflight
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    outputs:
      marketing_version: ${{ steps.upload.outputs.marketing_version }}
      build_number: ${{ steps.upload.outputs.build_number }}
      source_sha: ${{ github.sha }}
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive, validate and upload build
        id: upload
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_DEVELOPER_API_KEY_ID: ${{ vars.ASC_DEVELOPER_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_ACTIVITY_PROFILE_BASE64: ${{ secrets.IOS_ACTIVITY_PROFILE_BASE64 }}
          ASC_DEVELOPER_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_DEVELOPER_API_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/testflight
      - name: Remove signing material and restore keychains
        if: always()
        run: python3 scripts/testflight cleanup
  # Captured alongside the build, from the same commit, so the listing shows the uploaded app.
  listing-screenshots:
    if: inputs.submit && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/screenshots.yml
    with:
      ref: ${{ github.sha }}
      set: listing
      max-parts: "1"
  metadata:
    needs: [publish, listing-screenshots]
    # Without submit, the listing screenshots are skipped and the text copy still syncs.
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      (needs.listing-screenshots.result == 'success' ||
       (!inputs.submit && needs.listing-screenshots.result == 'skipped')) &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Submitting waits up to about 20 minutes for Apple to process the build.
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.submit
        with:
          name: ${{ needs.listing-screenshots.outputs.artifact }}
          path: ${{ runner.temp }}/listing
      - name: Sync supplied listing and TestFlight metadata
        env:
          METADATA_SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
          METADATA_BUILD_NUMBER: ${{ needs.publish.outputs.build_number }}
          METADATA_MARKETING_VERSION: ${{ needs.publish.outputs.marketing_version }}
          ASC_METADATA_API_KEY_ID: ${{ vars.ASC_METADATA_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
          ASC_METADATA_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_METADATA_API_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/metadata_sync.py
      - name: Sync the App Review notes and listing screenshots, then submit for App Review
        env:
          SUBMIT: ${{ inputs.submit }}
          LISTING_SCREENSHOTS: ${{ inputs.submit && format('{0}/listing', runner.temp) || '' }}
          METADATA_SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
          METADATA_BUILD_NUMBER: ${{ needs.publish.outputs.build_number }}
          METADATA_MARKETING_VERSION: ${{ needs.publish.outputs.marketing_version }}
          ASC_METADATA_API_KEY_ID: ${{ vars.ASC_METADATA_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
          ASC_METADATA_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_METADATA_API_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/app_store.py review
