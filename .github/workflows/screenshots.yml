name: Screenshots
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, commit or pull request number to capture (empty for this run's branch)
        required: false
        default: ""
      set:
        description: What to capture; the accessibility set chooses its own simulators and appearances
        type: choice
        options: [every screen, accessibility]
        default: every screen
      devices:
        description: Simulators, as largest, smallest or exact names, separated by commas
        required: false
        default: largest,smallest
      appearances:
        description: Appearances to capture
        type: choice
        options: [light and dark, light, dark]
        default: light and dark
      filter:
        description: Screen name prefixes, separated by commas (empty for every screen)
        required: false
        default: ""
      max-parts:
        description: Most captures of each screen that scrolls, counting the first, from 1 (only the top) to 9
        required: false
        default: "9"
      log-images:
        description: Also print the images into the log as base64, for clients that can't download artifacts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'screenshots') &&
       (github.event.action != 'labeled' || github.event.label.name == 'screenshots'))
    # A newer capture request for a labeled pull request (a push, a reopen or re-adding the label)
    # cancels that pull request's older capture, since only its newest head needs screenshots.
    # Manual runs each get a group of their own and never cancel or replace another run. This is
    # on the job, not the workflow, so a run whose capture is skipped, such as one for an
    # unrelated label, can't cancel a capture in progress.
    concurrency:
      group: screenshots-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: xcode-27
    # The accessibility set took about 42 minutes on hosted runners before screens were captured
    # in parts, mostly simulator boots and captures. Up to nine parts per screen hasn't been timed
    # yet, so this leaves room for those parts and for a slow runner.
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Choose what to check out
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            echo "ref=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_INPUT" == *$'\n'* || "$REF_INPUT" == *$'\r'* ]]; then
            echo "The capture ref must be a single line" >&2
            exit 1
          elif [[ "$REF_INPUT" =~ ^[0-9]+$ ]]; then
            echo "ref=refs/pull/$REF_INPUT/head" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF_INPUT" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false
      - name: Report the captured source
        run: |
          revision=$(git rev-parse HEAD)
          echo "Capturing commit $revision"
          echo "Capturing commit \`$revision\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture the screens
        env:
          CAPTURE_SET: ${{ inputs.set }}
          DEVICES: ${{ inputs.devices || 'largest,smallest' }}
          APPEARANCES: ${{ inputs.appearances == 'light' && 'light' || inputs.appearances == 'dark' && 'dark' || 'light,dark' }}
          SCREEN_FILTER: ${{ inputs.filter }}
          MAX_PARTS: ${{ inputs.max-parts || '9' }}
        run: |
          if [[ "$CAPTURE_SET" == accessibility ]]; then
            python3 scripts/screenshots capture --set accessibility --filter "$SCREEN_FILTER" \
              --max-parts "$MAX_PARTS" --output "$RUNNER_TEMP/screenshots"
          else
            python3 scripts/screenshots capture --devices "$DEVICES" \
              --appearances "$APPEARANCES" --filter "$SCREEN_FILTER" \
              --max-parts "$MAX_PARTS" --output "$RUNNER_TEMP/screenshots"
          fi
      # A failed run still uploads what it captured, to show what went wrong.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: screenshots-run-${{ github.run_number }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          retention-days: 7
      - name: Print the images as base64
        if: inputs.log-images
        run: |
          for image in "$RUNNER_TEMP"/screenshots/*.png; do
            echo "SCREENSHOT-BEGIN $(basename "$image")"
            base64 -i "$image" | tr -d '\n' | fold -w 4000
            echo
            echo "SCREENSHOT-END $(basename "$image")"
          done
