[project]
site_name = "Compasslet"
site_description = "Compass for iPhone and CarPlay."
site_url = "https://compasslet.lunchbox-labs.dev/"
docs_dir = "docs"
site_dir = "site"
nav = [
  "index.md",
  "support.md",
  "privacy.md",
]

[project.theme]
font = false
features = [
  # Load pages in place instead of full reloads, prefetch them on hover and
  # show a progress bar when a load takes longer than 400 ms. All requests stay
  # on this site; instant navigation relies on site_url for its sitemap.
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
]

# The first palette follows the system appearance. The header toggle cycles
# system -> light -> dark and remembers the choice in the browser.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to Light Mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to Dark Mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to System Preference"
