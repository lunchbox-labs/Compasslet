name: Repeat Tests
on:
  # Run by hand, from the branch to test, to check whether the simulator tests are flaky. This
  # never runs on pull requests or pushes, so it can't block a merge.
  workflow_dispatch:
    inputs:
      iterations:
        description: Most times to run the simulator tests, stopping at the first failure (2 to 100)
        required: false
        default: "20"
permissions:
  contents: read
jobs:
  repeat:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Check the number of iterations
        env:
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          if [[ ! "$ITERATIONS" =~ ^[0-9]+$ ]] || (( 10#$ITERATIONS < 2 || 10#$ITERATIONS > 100 )); then
            echo "iterations must be a whole number from 2 to 100" >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the simulator tests until one fails
        env:
          ITERATIONS: ${{ inputs.iterations }}
        run: bash scripts/test-ios -test-iterations "$((10#$ITERATIONS))" -run-tests-until-failure
      # The result bundle shows which iteration failed and why.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: repeat-tests-run-${{ github.run_number }}
          path: .build/test-results.*/
          retention-days: 7
