name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test metadata sync without Apple credentials or API access
        run: python3 -m unittest discover -s scripts/tests -v
  check:
    runs-on: ubuntu-latest
    container: swift:6.4.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Trust the mounted checkout in this ephemeral container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash scripts/swift-style check
      - run: swift build --jobs 4 -c release
      - run: swift test --jobs 4
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test the helper scripts
        run: python3 -m unittest discover -s scripts/tests -v
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      simulators: ${{ steps.scope.outputs.simulators }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The pull request merge commit and both of its parents, so the diff against
          # the base branch needs no further fetch.
          fetch-depth: 2
      - name: Decide whether the changed files need the simulator checks
        id: scope
        env:
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-scope
  native:
    needs: scope
    # Pushes to main always run the simulator checks. When the scope job cannot say what
    # changed, they run anyway and that failed job keeps the run red.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.simulators == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and test on an available iPhone simulator
        # DEVELOPER_DIR pins the toolchain, and the test build compiles the arm64 products
        # the simulator runs, so neither a toolchain probe nor a separate build is needed.
        run: bash scripts/test-ios
  watch:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.simulators == 'true') }}
    runs-on: xcode-27
    # Runtime cleanup, the build, the test step budget, the bounded diagnostics and the upload.
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Remove duplicate simulator runtimes
        # The image registers the watchOS runtime twice and later unmounts the booted copy
        # while cleaning up the duplicate. Delete the unusable record before anything boots.
        timeout-minutes: 8
        run: python3 scripts/remove-duplicate-runtimes
      - name: Build unsigned Watch app
        # Produces the app the warm-up installs before XCTest; the x86_64 slice is excluded
        # because the simulator is arm64.
        run: >-
          xcodebuild -project Compass.xcodeproj -scheme CompassWatch
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath .build/watch CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64 build
      - name: Test on an available Watch simulator
        # Bound the step rather than the job so a hung test run still reaches diagnostics.
        # Discovery, two boots, the warm-up and the test run add up to just under this at
        # their own bounds, so a slow run fails with a script's message, not the step's.
        timeout-minutes: 35
        run: bash scripts/test-watch
      - name: Diagnose Watch runtime failure
        if: failure()
        run: python3 scripts/watch-runtime-diagnostics
      - name: Preserve failed Watch test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watch-test-results
          path: .build/watch-test-results.*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
