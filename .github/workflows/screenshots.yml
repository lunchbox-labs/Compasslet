name: Screenshots
on:
  pull_request:
    paths:
      - "AppTests/ScreenshotTests.swift"
      - "scripts/screenshots"
      - ".github/workflows/screenshots.yml"
  push:
    branches: [main]
    # Documentation never changes what the app shows, so the newest set stays current.
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - ".github/CODEOWNERS"
      - "docs/**"
      - "app-store/**"
      - "website/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, commit or pull request number to capture (empty for this run's branch)
        required: false
        default: ""
      devices:
        description: Simulators, as largest, smallest or exact names, separated by commas
        required: false
        default: largest,smallest
      appearances:
        description: Appearances to capture
        type: choice
        options: [light and dark, light, dark]
        default: light and dark
      filter:
        description: Screen name prefixes, separated by commas (empty for every screen)
        required: false
        default: ""
      release-tag:
        description: Attach the screenshots to this draft release, creating the draft if needed
        required: false
        default: ""
      log-images:
        description: Also print the images into the log as base64, for clients that can't download artifacts
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Pull requests keep only their newest run. Main pushes queue, so the newest set is kept last.
  group: >-
    screenshots-${{ github.event_name == 'workflow_dispatch' && github.run_id ||
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  capture:
    if: github.event_name != 'release'
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      artifact: ${{ steps.source.outputs.artifact }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Choose what to check out
        id: target
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          if [[ "$REF_INPUT" =~ ^[0-9]+$ ]]; then
            echo "ref=refs/pull/$REF_INPUT/head" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF_INPUT" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false
      - name: Name the capture
        id: source
        env:
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          case "$EVENT" in
            push) echo "artifact=screenshots-main" >> "$GITHUB_OUTPUT" ;;
            pull_request) echo "artifact=screenshots-pr-$PULL_REQUEST" >> "$GITHUB_OUTPUT" ;;
            *) echo "artifact=screenshots-run-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Capture every screen on each simulator and appearance
        env:
          DEVICES: ${{ inputs.devices || 'largest,smallest' }}
          APPEARANCES: ${{ inputs.appearances == 'light' && 'light' || inputs.appearances == 'dark' && 'dark' || 'light,dark' }}
          SCREEN_FILTER: ${{ inputs.filter }}
        run: >-
          python3 scripts/screenshots capture --devices "$DEVICES" --appearances "$APPEARANCES"
          --filter "$SCREEN_FILTER" --output "$RUNNER_TEMP/screenshots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          # Main keeps one set, replaced by every merge; the longest retention keeps it between
          # merges. Other captures are for reviewing a change.
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
      - name: Print the images as base64
        if: inputs.log-images
        run: |
          for image in "$RUNNER_TEMP"/screenshots/*.png; do
            echo "SCREENSHOT-BEGIN $(basename "$image")"
            base64 -i "$image" | tr -d '\n' | fold -w 4000
            echo
            echo "SCREENSHOT-END $(basename "$image")"
          done
  keep-latest:
    needs: capture
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete earlier main screenshot sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=screenshots-main" \
            --jq ".artifacts[] | select(.workflow_run.id != $GITHUB_RUN_ID) | .id" |
            while read -r artifact; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
            done
  release:
    needs: capture
    if: github.event_name == 'workflow_dispatch' && inputs.release-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.capture.outputs.artifact }}
          path: ${{ runner.temp }}/screenshots
      # Releases are immutable once published, so the images go on the draft beforehand.
      - name: Attach the screenshots to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
          TARGET: ${{ needs.capture.outputs.sha }}
        run: >-
          python3 scripts/screenshots release --tag "$TAG" --target "$TARGET"
          --repository "$GITHUB_REPOSITORY" --directory "$RUNNER_TEMP/screenshots"
  wiki:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Update the Release Screenshots wiki page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern screenshots.json --dir "$RUNNER_TEMP"; then
            echo "::notice::$TAG has no screenshots attached; the wiki page is unchanged"
            exit 0
          fi
          wiki="$RUNNER_TEMP/wiki"
          git clone --depth 1 \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.wiki.git" "$wiki"
          python3 scripts/screenshots wiki-page --manifest "$RUNNER_TEMP/screenshots.json" \
            --repository "$GITHUB_REPOSITORY" --wiki "$wiki"
          cd "$wiki"
          if [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Release-Screenshots.md
          git commit -m "Show the screenshots of $TAG"
          git push origin HEAD
