name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to a pull request cancels its older run. Every other run gets a group of its
  # own, so each push to main and each manual run finishes with a result, including the commit
  # Publish uses: a shared group would hold only one pending run and drop the rest.
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    container: swift:6.4.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Trust the mounted checkout in this ephemeral container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash scripts/swift-style check
      - run: swift build --jobs 4 -c release
      - run: swift test --jobs 4
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test the helper scripts, including metadata sync, without Apple credentials or API access
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test the workflow event conditions
        run: |
          npm ci --prefix scripts/tests/workflows --ignore-scripts --no-audit --no-fund
          npm test --prefix scripts/tests/workflows
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      simulators: ${{ steps.scope.outputs.simulators }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The pull request merge commit and both of its parents, so the diff against
          # the base branch needs no further fetch.
          fetch-depth: 2
      - name: Decide whether the changed files need the simulator checks
        id: scope
        env:
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-scope
  native:
    needs: scope
    # Pushes to main always run the simulator checks. When the scope job cannot say what
    # changed, they run anyway and that failed job keeps the run red.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.simulators == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The step times out before the job does, so a hung run still counts as a test failure
      # and keeps its result bundle.
      - name: Build and test on an available iPhone simulator
        id: test
        timeout-minutes: 20
        # DEVELOPER_DIR pins the toolchain, and the test build compiles the arm64 products
        # the simulator runs, so neither a toolchain probe nor a separate build is needed.
        run: bash scripts/test-ios
      # A failed test run keeps its result bundle, with each test's failure details, timings and
      # attachments, so it can be diagnosed without running the job again. Passing runs upload
      # nothing. The bundle sits under the hidden .build folder, so hidden files must be included
      # or nothing is uploaded, and each attempt gets its own name so a re-run can upload too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.test.outcome == 'failure'
        with:
          name: check-test-results-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: .build/test-results.*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
