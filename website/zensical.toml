[project]
site_name = "Compasslet"
site_description = "Compass for iPhone and CarPlay."
site_url = "https://compasslet.lunchbox-labs.dev/"
repo_url = "https://github.com/lunchbox-labs/compasslet"
repo_name = "lunchbox-labs/compasslet"
docs_dir = "docs"
site_dir = "site"
nav = [
  "index.md",
  "support.md",
  "shortcuts.md",
  "privacy.md",
]
extra_css = ["stylesheets/brand.css"]

[project.theme]
font = false
icon.repo = "fontawesome/brands/github"
features = [
  # Load pages in place instead of full reloads, prefetch them on hover and
  # show a progress bar when a load takes longer than 400 ms. These page loads
  # stay on this site; instant navigation relies on site_url for its sitemap.
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
]

# The first palette follows the system appearance. The header toggle cycles
# system -> light -> dark and remembers the choice in the browser.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to Light Mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to Dark Mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to System Preference"

# The site has four short pages, so search adds nothing. Turning the plugin
# off removes the header search box and leaves the search index empty.
[project.plugins.search]
enabled = false
